<!DOCTYPE html>
<html>
    <head>
        <title>Instameow</title>
        <meta charset="UTF-8">
        <meta name="description" content="Pawsome digital works">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="merp">
        <link rel="stylesheet" href="styles/instameow.css">
    </head>
    <body>
        <!-- Website title-->
        <header>
            <h2>Instameow Feed</h2>
        </header>

        <main>
            <div class="wrapper">
                <!-- Container for one post -->
                <article class="post">
                    <!-- Information section for one post -->
                    <section class="info">
                        <!-- User details section -->
                        <section class="user">
                            <!-- Profile picture -->
                            <div class="profile-pic">
                                <img id="profile-img" src="media/merp-ball.png">
                            </div>
                            <!-- Username of post author -->
                            <p class="username">merp-designs</p>
                        </section>
                    </section>

                    <!-- Image carousel container -->
                    <section class="carousel-container">
                        <!-- Carousel image -->
                        <div>
                            <img class="carousel" src="https://64.media.tumblr.com/4aef6c34e6b445d992ecc2d8847c43b1/1d2644683a6afe5d-66/s400x600/6aee96a645e94d82ab6663d8efda4ad34f5ced9c.png">
                        </div>

                        <!-- Next & prev buttons -->
                        <button class="prev">&#10094;</button>
                        <button class="next">&#10095;</button>
                    </section>

                    <!-- Content section for post -->
                    <section class="post-content">
                        <section class="reaction-wrapper">
                            <!-- Like button -->
                            <img class="like-btn" src="https://static.thenounproject.com/png/5054463-200.png" alt="Like">
                        </section>
                    </section>
                    <!-- Post description -->
                    <p class="description"><span>merp-designs</span> Some recent works :P</p>
                    <!-- Post timestamp -->
                    <p class="post-time">2 minutes ago</p>
                </article>
            </div>
        </main>
    </body>
    <script src="scripts/instameow.js"></script>
</html>
